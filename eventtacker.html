<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARROOM | Global Threat & Trade Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #080b10;
            --panel-bg: #0d1117;
            --accent-red: #ff2424;
            --accent-amber: #f59e0b;
            --accent-cyan: #00d4ff;
            --border-glow: rgba(255, 36, 36, 0.3);
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Share Tech Mono', monospace; 
            background: var(--bg-deep); 
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        /* --- Top Bar & Ticker --- */
        #header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            z-index: 1000;
        }

        .logo { color: var(--accent-red); font-size: 24px; font-weight: bold; letter-spacing: 4px; }
        
        .status-indicators { display: flex; gap: 15px; font-size: 12px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot.green { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
        .dot.red { background: var(--accent-red); }
        .dot.yellow { background: var(--accent-amber); }

        #ticker-container {
            height: 30px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ticker-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 60s linear infinite;
        }
        .ticker-item { display: inline-block; padding: 0 20px; font-size: 13px; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- Main Layout --- */
        #main { display: flex; height: calc(100vh - 90px); }
        
        #map { width: 60%; height: 100%; position: relative; }
        #map::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 999;
        }

        #side-panel {
            width: 40%;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Feed Elements --- */
        .filter-tabs {
            display: flex;
            background: #161b22;
            padding: 10px;
            gap: 5px;
            border-bottom: 1px solid var(--border-glow);
        }
        .tab {
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #30363d;
            background: transparent;
            color: #8b949e;
        }
        .tab.active { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        #alerts-feed {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .alert-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-left: 4px solid #8b949e;
            padding: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
            transition: 0.3s;
        }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .alert-card.CRITICAL { border-left-color: var(--accent-red); }
        .alert-card.HIGH { border-left-color: var(--accent-amber); }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            margin-right: 5px;
        }
        .chip {
            display: inline-block;
            font-size: 9px;
            background: #21262d;
            padding: 1px 5px;
            margin: 2px;
            border: 1px solid #30363d;
        }

        /* --- Map Animations --- */
        .pulse {
            border-radius: 50%;
            height: 12px; width: 12px;
            position: absolute;
            background: var(--accent-red);
            box-shadow: 0 0 0 0 rgba(255, 36, 36, 0.7);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 36, 36, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(255, 36, 36, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 36, 36, 0); }
        }

        /* Custom Popup styling */
        .leaflet-popup-content-wrapper { background: var(--panel-bg); color: white; border: 1px solid var(--accent-red); }
        .leaflet-popup-tip { background: var(--accent-red); }
    </style>
</head>
<body>

<div id="header">
    <div class="logo">WARROOM <span style="font-size: 12px; vertical-align: middle; color: #555;">v3.0.1</span></div>
    <div id="clock" style="font-size: 20px;">00:00:00 UTC</div>
    <div class="status-indicators">
        <span>GDELT <span id="s-gdelt" class="dot yellow"></span></span>
        <span>OPENSKY <span id="s-open" class="dot yellow"></span></span>
        <span>NEWSAPI <span id="s-news" class="dot yellow"></span></span>
        <span>AIS <span id="s-ais" class="dot yellow"></span></span>
    </div>
</div>

<div id="ticker-container">
    <div class="ticker-wrap">
        <div class="ticker-move" id="market-ticker">
            </div>
    </div>
</div>

<div id="main">
    <div id="map"></div>
    <div id="side-panel">
        <div class="filter-tabs">
            <button class="tab active" onclick="filterFeed('ALL')">ALL</button>
            <button class="tab" onclick="filterFeed('ENERGY')">ENERGY</button>
            <button class="tab" onclick="filterFeed('SHIPPING')">SHIPPING</button>
            <button class="tab" onclick="filterFeed('MILITARY')">MILITARY</button>
        </div>
        <div id="alerts-feed"></div>
    </div>
</div>

<script>
/** * CONFIGURATION & API KEYS 
 */
const NEWSAPI_KEY = "YOUR_NEWSAPI_KEY"; // Replace with your key
const AISSTREAM_KEY = "YOUR_AISSTREAM_KEY"; // Replace with your key

// Central Geodata for ~80 Countries (Abbreviated for brevity)
const GEO_LOOKUP = {
    "US": [37.09, -95.71], "CN": [35.86, 104.19], "RU": [61.52, 105.31], "IR": [32.42, 53.68],
    "UA": [48.37, 31.16], "IL": [31.04, 34.85], "TW": [23.69, 120.96], "YE": [15.55, 48.51],
    "PK": [30.37, 69.34], "KP": [40.33, 127.51], "LY": [26.33, 17.22], "SD": [12.86, 30.21],
    "IN": [20.59, 78.96], "SA": [23.88, 45.07], "UK": [55.37, -3.43], "DE": [51.16, 10.45]
};

const SEED_DATA = [
    { title: "Red Sea Houthi drone attack on cargo vessel", lat: 12.8, lng: 43.5, severity: "CRITICAL", tags: ["SHIPPING", "ENERGY"] },
    { title: "Russia artillery strike near Zaporizhzhia", lat: 47.8, lng: 35.1, severity: "CRITICAL", tags: ["MILITARY"] },
    { title: "Taiwan Strait PLA naval exercise", lat: 23.5, lng: 120.0, severity: "HIGH", tags: ["MILITARY", "SHIPPING"] },
    { title: "Iran sanctions announcement", lat: 35.6, lng: 51.4, severity: "MEDIUM", tags: ["SANCTIONS", "CURRENCY"] },
    { title: "Libya oil field forced shutdown", lat: 27.0, lng: 14.2, severity: "HIGH", tags: ["OIL", "ENERGY"] }
];

/** * MAP INITIALIZATION 
 */
const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© CartoDB'
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
const aircraftLayer = L.layerGroup().addTo(map);
const vesselLayer = L.layerGroup().addTo(map);

// Define Chokepoints
const chokepoints = [
    { name: "Strait of Hormuz", bounds: [[26, 56], [27, 57]] },
    { name: "Bab-el-Mandeb", bounds: [[11, 43], [13, 44]] },
    { name: "Taiwan Strait", bounds: [[22, 119], [25, 121]] }
].forEach(cp => {
    L.rectangle(cp.bounds, {color: "red", weight: 1, fillOpacity: 0.1}).addTo(map)
     .bindTooltip(cp.name, {permanent: false, direction: "center"});
});

/**
 * DATA ENGINE
 */
let markets = [
    { name: "Brent Crude", val: 82.45, change: 0.12 },
    { name: "Gold", val: 2154.20, change: -0.05 },
    { name: "WTI Crude", val: 78.12, change: 0.45 },
    { name: "S&P 500 Fut", val: 5120, change: -0.21 },
    { name: "DXY", val: 103.82, change: 0.08 }
];

function updateTicker() {
    const ticker = document.getElementById('market-ticker');
    ticker.innerHTML = '';
    const content = markets.map(m => {
        m.val *= (1 + (Math.random() * 0.002 - 0.001));
        const color = m.change >= 0 ? '#22c55e' : '#ff2424';
        const arrow = m.change >= 0 ? '▲' : '▼';
        return `<span class="ticker-item">${m.name}: <span style="color:${color}">${m.val.toFixed(2)} ${arrow} ${Math.abs(m.change)}%</span></span>`;
    }).join('');
    ticker.innerHTML = content + content; // Duplicate for infinite loop
}

function updateClock() {
    document.getElementById('clock').innerText = new Date().toISOString().substr(11, 8) + " UTC";
}

/**
 * GDELT INTEGRATION
 */
async function fetchGDELT() {
    try {
        const response = await fetch(`https://api.gdeltproject.org/api/v2/doc/doc?query=war%20OR%20attack%20OR%20conflict%20OR%20sanctions&mode=artlist&maxrecords=10&format=json&timespan=24h`);
        const data = await response.json();
        document.getElementById('s-gdelt').className = 'dot green';
        processGDELT(data.articles);
    } catch (e) {
        console.error("GDELT Error, using seeds", e);
        document.getElementById('s-gdelt').className = 'dot red';
        SEED_DATA.forEach(addAlert);
    }
}

function processGDELT(articles) {
    articles.forEach(art => {
        let severity = "WATCH";
        const tone = parseFloat(art.tone);
        if (tone < -10) severity = "CRITICAL";
        else if (tone < -5) severity = "HIGH";
        else if (tone < -2) severity = "MEDIUM";

        const tags = [];
        const title = art.title.toLowerCase();
        if (title.includes("oil") || title.includes("energy")) tags.push("ENERGY");
        if (title.includes("ship") || title.includes("vessel")) tags.push("SHIPPING");
        if (title.includes("missile") || title.includes("strike")) tags.push("MILITARY");

        const countryCode = art.sourcecountry || "US";
        const coords = GEO_LOOKUP[countryCode] || [0, 0];

        addAlert({
            title: art.title,
            lat: coords[0],
            lng: coords[1],
            severity: severity,
            tags: tags,
            source: art.sourceurl
        });
    });
}

function addAlert(data) {
    // Add to Map
    const color = data.severity === 'CRITICAL' ? '#ff2424' : (data.severity === 'HIGH' ? '#f59e0b' : '#00d4ff');
    const marker = L.circleMarker([data.lat, data.lng], {
        radius: data.severity === 'CRITICAL' ? 8 : 5,
        color: color,
        fillOpacity: 0.8
    }).addTo(markersLayer);
    
    marker.bindPopup(`<b>${data.severity}: ${data.title}</b><br><a href="${data.source}" target="_blank">Source Link</a>`);

    // Add to Feed
    const feed = document.getElementById('alerts-feed');
    const card = document.createElement('div');
    card.className = `alert-card ${data.severity}`;
    card.innerHTML = `
        <span class="badge" style="background:${color}">${data.severity}</span>
        <div style="margin-top:5px; font-weight:bold">${data.title}</div>
        <div style="margin-top:5px">${data.tags.map(t => `<span class="chip">${t}</span>`).join('')}</div>
        <div style="font-size:10px; color:#555; margin-top:5px">Source: GDELT • Just now</div>
    `;
    feed.prepend(card);
    if (feed.children.length > 50) feed.lastChild.remove();
}

/**
 * AIRCRAFT TRACKER (OpenSky)
 */
async function fetchOpenSky() {
    try {
        const res = await fetch('https://opensky-network.org/api/states/all?lamin=15&lamin=15&lamax=45&lomin=30&lomax=140');
        const data = await res.json();
        document.getElementById('s-open').className = 'dot green';
        renderPlanes(data.states.slice(0, 30));
    } catch (e) {
        document.getElementById('s-open').className = 'dot red';
    }
}

function renderPlanes(states) {
    aircraftLayer.clearLayers();
    states.forEach(s => {
        if (!s[5] || !s[6]) return;
        L.marker([s[6], s[5]], {
            icon: L.divIcon({ html: `<div style="color:white; font-size:12px; transform: rotate(${s[10]}deg)">✈</div>`, className: '' })
        }).addTo(aircraftLayer)
          .bindTooltip(`${s[1]} | ${Math.round(s[9])}m/s`);
    });
}

/**
 * INITIALIZE
 */
window.onload = () => {
    setInterval(updateClock, 1000);
    setInterval(updateTicker, 4000);
    setInterval(fetchGDELT, 300000); // 5 mins
    setInterval(fetchOpenSky, 30000); // 30s
    
    // Initial Load
    fetchGDELT();
    updateTicker();
    
    // Manual triggers for demo
    SEED_DATA.forEach(d => addAlert(d));
};

function filterFeed(tag) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    // Simple filter logic would go here
}
</script>

</body>
</html>

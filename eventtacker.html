<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARROOM — Global Threat Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
  --bg:#080b10;--panel:#0d1117;--panel2:#111820;
  --border:rgba(255,36,36,0.22);--red:#ff2424;--amber:#f59e0b;
  --cyan:#00d4ff;--green:#00ff88;--grey:#4a5568;--text:#c9d1d9;--dim:#6e7681;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;}

/* LOADING OVERLAY */
#ov{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#ov-title{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:var(--red);letter-spacing:8px;text-shadow:0 0 30px rgba(255,36,36,0.5);}
#ov-sub{font-size:10px;color:var(--dim);letter-spacing:3px;}
#ov-barwrap{width:300px;height:2px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
#ov-bar{height:100%;background:var(--red);width:0%;transition:width 0.35s ease;box-shadow:0 0 10px var(--red);}
#ov-msg{font-size:10px;color:var(--dim);letter-spacing:1px;min-height:16px;text-align:center;}

/* TOPBAR — fixed 44px */
#topbar{
  position:fixed;top:0;left:0;right:0;
  height:44px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;z-index:2000;
  box-shadow:0 2px 18px rgba(255,36,36,0.07);
}
#logo{padding:0 16px;font-family:'Orbitron',monospace;font-weight:900;font-size:14px;color:var(--red);letter-spacing:4px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;white-space:nowrap;text-shadow:0 0 12px rgba(255,36,36,0.55);flex-shrink:0;}
.blink{animation:blink 1s step-end infinite;}@keyframes blink{50%{opacity:0;}}
#tw{flex:1;overflow:hidden;height:100%;border-right:1px solid var(--border);display:flex;align-items:center;min-width:0;}
#ticker{display:flex;white-space:nowrap;animation:ticker-anim 90s linear infinite;}
@keyframes ticker-anim{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.ti{padding:0 14px;font-size:11px;border-right:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:6px;height:44px;flex-shrink:0;}
.tl{color:var(--dim);font-size:9px;}.tu{color:var(--green);}.td{color:var(--red);}
#sb{padding:0 12px;display:flex;align-items:center;gap:10px;font-size:9px;white-space:nowrap;border-right:1px solid var(--border);height:100%;flex-shrink:0;}
.sdot{display:inline-flex;align-items:center;gap:4px;color:var(--dim);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grey);transition:background 0.4s,box-shadow 0.4s;}
.dot.g{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot.r{background:var(--red);box-shadow:0 0 6px var(--red);}
.dot.y{background:var(--amber);animation:pdot 1s infinite;}@keyframes pdot{50%{opacity:0.2;}}
#clk{padding:0 12px;font-size:11px;color:var(--cyan);font-family:'Orbitron',monospace;white-space:nowrap;letter-spacing:1px;height:100%;display:flex;align-items:center;flex-shrink:0;}
#lb{padding:0 10px;height:100%;display:flex;align-items:center;flex-shrink:0;}
.bsim{background:rgba(245,158,11,0.1);border:1px solid var(--amber);color:var(--amber);font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:2px;}
.bliv{background:rgba(0,255,136,0.1);border:1px solid var(--green);color:var(--green);font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:2px;}

/* MAIN CONTENT — below fixed topbar */
#main{
  position:fixed;
  top:44px;left:0;right:0;bottom:0;
  display:flex;
}

/* MAP SIDE */
#map-side{
  position:relative;
  flex:0 0 62%;
  height:100%;
  border-right:1px solid var(--border);
  overflow:hidden;
}
/* THE MAP — explicit pixel calc so Leaflet gets real dimensions */
#map{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  width:100%;
  height:100%;
  background:#0a0e14;
}
/* Layer controls */
#lc{
  position:absolute;top:12px;left:12px;z-index:1000;
  background:rgba(8,11,16,0.93);border:1px solid var(--border);
  border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
.lrow{display:flex;align-items:center;gap:8px;font-size:11px;cursor:pointer;color:var(--text);user-select:none;}
.lrow input{accent-color:var(--cyan);cursor:pointer;width:13px;height:13px;}

/* SCANLINE */
#map-side::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:600;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.018) 3px,rgba(0,0,0,0.018) 4px);
}

/* RIGHT PANEL */
#rp{flex:1;display:flex;flex-direction:column;background:var(--panel);overflow:hidden;min-width:0;}
#rp-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#rp-title{font-family:'Orbitron',monospace;font-size:11px;color:var(--red);letter-spacing:3px;}
#alertct{background:var(--red);color:#fff;font-size:9px;padding:2px 8px;border-radius:10px;font-family:'Orbitron',monospace;}
#ftabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#ftabs::-webkit-scrollbar{display:none;}
.ftab{padding:8px 12px;font-size:10px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;letter-spacing:1px;}
.ftab:hover{color:var(--text);}.ftab.on{color:var(--cyan);border-bottom-color:var(--cyan);}
.fbadge{background:rgba(255,36,36,0.85);color:#fff;font-size:8px;padding:1px 4px;border-radius:8px;margin-left:4px;}
#feed{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
#feed::-webkit-scrollbar{width:4px;}
#feed::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ALERT CARDS */
.card{
  background:var(--panel2);border:1px solid rgba(255,255,255,0.04);
  border-left:3px solid var(--grey);border-radius:4px;padding:10px 12px;
  cursor:pointer;transition:background 0.2s;
  animation:cslide 0.3s ease;
}
@keyframes cslide{from{transform:translateX(12px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.card:hover{background:rgba(255,255,255,0.025);}
.card.critical{border-left-color:var(--red);}
.card.high{border-left-color:var(--amber);}
.card.medium{border-left-color:#eab308;}
.card.watch{border-left-color:var(--grey);}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.sevbadge{font-size:8px;padding:2px 6px;border-radius:3px;letter-spacing:1px;font-weight:bold;flex-shrink:0;}
.sev-critical{background:rgba(255,36,36,0.15);color:var(--red);border:1px solid var(--red);}
.sev-high{background:rgba(245,158,11,0.15);color:var(--amber);border:1px solid var(--amber);}
.sev-medium{background:rgba(234,179,8,0.12);color:#eab308;border:1px solid #eab308;}
.sev-watch{background:rgba(74,85,104,0.2);color:var(--dim);border:1px solid var(--grey);}
.card-title{font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-body{font-size:10px;color:var(--dim);line-height:1.5;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.chip{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid;}
.c-oil{color:#fb923c;border-color:rgba(251,146,60,0.4);background:rgba(251,146,60,0.07);}
.c-gold{color:#fbbf24;border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.07);}
.c-defense{color:var(--red);border-color:rgba(255,36,36,0.4);background:rgba(255,36,36,0.07);}
.c-shipping{color:var(--cyan);border-color:rgba(0,212,255,0.4);background:rgba(0,212,255,0.07);}
.c-grain{color:#84cc16;border-color:rgba(132,204,22,0.4);background:rgba(132,204,22,0.07);}
.c-currency{color:#a78bfa;border-color:rgba(167,139,250,0.4);background:rgba(167,139,250,0.07);}
.card-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.csrc,.ctime{font-size:9px;color:var(--dim);}

/* LEAFLET POPUP THEME */
.leaflet-popup-content-wrapper{background:rgba(10,13,20,0.97)!important;border:1px solid rgba(255,36,36,0.3)!important;border-radius:4px!important;color:var(--text)!important;font-family:'Share Tech Mono',monospace!important;box-shadow:0 0 24px rgba(255,36,36,0.15)!important;}
.leaflet-popup-tip{background:rgba(10,13,20,0.97)!important;}
.leaflet-popup-content{margin:12px 14px!important;font-size:11px!important;min-width:200px;}
.pp-title{font-size:12px;color:var(--text);margin-bottom:9px;line-height:1.4;font-weight:bold;}
.pp-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:4px;font-size:10px;}
.pp-label{color:var(--dim);}.pp-val{color:var(--cyan);}
.pp-chips{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 4px;}
.pp-link{display:inline-block;margin-top:7px;font-size:10px;color:var(--cyan);text-decoration:none;border:1px solid rgba(0,212,255,0.3);padding:3px 10px;border-radius:3px;}
.pp-link:hover{background:rgba(0,212,255,0.1);}
.pp-warn{margin-top:7px;color:var(--red);font-size:10px;}
.pp-amber{margin-top:7px;color:var(--amber);font-size:10px;}
.leaflet-control-zoom a{background:var(--panel2)!important;color:var(--text)!important;border-color:rgba(255,36,36,0.2)!important;}
.leaflet-control-zoom a:hover{color:var(--cyan)!important;background:var(--panel)!important;}
.leaflet-control-attribution{background:rgba(8,11,16,0.75)!important;color:#2a2a2a!important;font-size:8px!important;}
.leaflet-control-attribution a{color:#333!important;}

/* Pulse ring animation used inline */
@keyframes PULSE{0%{transform:scale(0.6);opacity:0.9;}100%{transform:scale(2.8);opacity:0;}}

<script>
/* =====================================================
   CREDENTIALS
===================================================== */
const NEWSAPI_KEY   = "0e0bec98af564306b60026525c2930ed";
const AISSTREAM_KEY = "e7168cd8a027d963fc814e8b50371ee53f31e1c6";
const OPENSKY_USER  = "hayyaanraza";
const OPENSKY_PASS  = "@HrAbcd1234";

/* =====================================================
   UTILS
===================================================== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc   = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* =====================================================
   COUNTRY COORDS
===================================================== */
const CC={US:[37.09,-95.71],GB:[55.38,-3.44],FR:[46.23,2.21],DE:[51.17,10.45],RU:[61.52,105.31],CN:[35.86,104.19],IN:[20.59,78.96],PK:[30.38,69.35],IR:[32.43,53.68],IQ:[33.22,43.68],SY:[34.80,38.99],YE:[15.55,48.52],SA:[23.89,45.08],IL:[31.05,34.85],PS:[31.95,35.29],LB:[33.85,35.86],TR:[38.96,35.24],UA:[48.38,31.17],PL:[51.92,19.14],AF:[33.94,67.71],LY:[26.34,17.23],SD:[12.86,30.22],SS:[4.86,31.57],ET:[9.15,40.49],SO:[5.15,46.20],NG:[9.08,8.67],ML:[17.57,-4.00],CF:[6.61,20.94],CD:[4.04,21.76],MM:[21.91,95.96],KP:[40.34,127.51],KR:[35.91,127.77],JP:[36.20,138.25],TW:[23.69,120.96],VN:[14.06,108.28],TH:[15.87,100.99],ID:[0.79,113.92],PH:[12.88,121.77],MY:[4.21,101.98],MX:[23.63,-102.55],VE:[6.42,-66.59],CO:[4.57,-74.30],BR:[-14.24,-51.93],AR:[-38.42,-63.62],EG:[26.82,30.80],MA:[31.79,-7.09],TN:[33.89,9.54],DZ:[28.03,1.66],GH:[7.95,-1.02],KE:[0.02,37.91],ZA:[-30.56,22.94],AO:[-11.20,17.87],AZ:[40.14,47.58],GE:[42.32,43.36],KZ:[48.02,66.92],UZ:[41.38,64.59],BD:[23.68,90.36],LK:[7.87,80.77],NP:[28.39,84.12],KW:[29.31,47.48],QA:[25.35,51.18],AE:[23.42,53.85],OM:[21.51,55.92],JO:[30.59,36.24],ES:[40.46,-3.75],IT:[41.87,12.57],GR:[39.07,21.82],RO:[45.94,24.97],HU:[47.16,19.50],CZ:[49.82,15.47],AT:[47.52,14.55],SE:[60.13,18.64],NO:[60.47,8.47],FI:[61.92,25.75],DK:[56.26,9.50],EE:[58.60,25.01],LV:[56.88,24.60],LT:[55.17,23.88],BY:[53.71,27.95],RS:[44.02,21.01],HR:[45.10,15.20],SK:[48.67,19.70],NL:[52.13,5.29],BE:[50.50,4.47],PT:[39.40,-8.22],BG:[42.73,25.49],CY:[35.13,33.43],IS:[64.96,-19.02],IE:[53.41,-8.24],CH:[46.82,8.23],ME:[42.71,19.37],AL:[41.15,20.17],MK:[41.61,21.75]};
const getCoords = iso => iso ? (CC[String(iso).toUpperCase().trim()]||null) : null;
const getFlag   = iso => {
  if(!iso||iso.length!==2) return '🌐';
  try{ return iso.toUpperCase().split('').map(c=>String.fromCodePoint(127397+c.charCodeAt(0))).join(''); }
  catch{ return '🌐'; }
};

/* =====================================================
   MARKET TICKER
===================================================== */
const MKT = {
  "BRENT":{v:82.45},"WTI":{v:78.20},"GOLD":{v:2318},"SILVER":{v:27.34},
  "NAT GAS":{v:2.87},"WHEAT":{v:548},"USD/INR":{v:83.72},"DXY":{v:104.28},
  "S&P FUT":{v:5218},"NIFTY FUT":{v:22480},"BDI":{v:1842},"VIX":{v:18.34}
};
const MBASE = {};
Object.keys(MKT).forEach(k => MBASE[k] = MKT[k].v);

function buildTicker(){
  let h='';
  for(let p=0;p<2;p++){
    Object.keys(MKT).forEach(k=>{
      const id='T_'+p+'_'+k.replace(/\W/g,'X');
      h+=`<div class="ti"><span class="tl">${esc(k)}</span><span id="${id}" class="tu">—</span></div>`;
    });
  }
  document.getElementById('ticker').innerHTML=h;
  tickUpdate();
}
function tickUpdate(){
  Object.keys(MKT).forEach(k=>{
    const d=MKT[k];
    d.v=parseFloat((d.v*(1+(Math.random()-0.5)*0.005)).toFixed(d.v>100?0:2));
    const pct=((d.v-MBASE[k])/MBASE[k]*100).toFixed(2);
    const up=d.v>=MBASE[k];
    const disp=d.v>999?d.v.toLocaleString():d.v;
    for(let p=0;p<2;p++){
      const el=document.getElementById('T_'+p+'_'+k.replace(/\W/g,'X'));
      if(el){ el.className=up?'tu':'td'; el.textContent=`${disp} ${up?'▲':'▼'}${Math.abs(pct)}%`; }
    }
  });
}

/* =====================================================
   MAP GLOBALS
===================================================== */
let MAP=null, CL=null, AL=null, SL=null, KL=null;
const AM={}, SM={};

/* =====================================================
   CHOKEPOINTS & CONFLICT ZONES
===================================================== */
const CPS=[
  {n:"Strait of Hormuz",       b:[[25.5,55.5],[27.5,57.5]]},
  {n:"Red Sea/Bab-el-Mandeb",  b:[[10.5,42.5],[13.5,44.5]]},
  {n:"Taiwan Strait",          b:[[21.5,119.0],[25.5,121.5]]},
  {n:"Black Sea",              b:[[41.0,28.0],[48.0,42.0]]},
  {n:"Strait of Malacca",      b:[[1.0,99.0],[6.0,105.0]]},
  {n:"Suez Canal",             b:[[29.5,32.0],[32.0,33.0]]},
];
const CZS=[
  {n:"Middle East",    b:[[15,30],[40,65]]},
  {n:"Eastern Europe", b:[[44,20],[60,45]]},
  {n:"South Asia",     b:[[5,60],[35,90]]},
  {n:"East Asia",      b:[[20,100],[45,140]]},
];
const inCP=(lat,lon)=>{for(const c of CPS){const[[s,w],[n,e]]=c.b;if(lat>=s&&lat<=n&&lon>=w&&lon<=e)return c.n;}return null;};
const inCZ=(lat,lon)=>{for(const z of CZS){const[[s,w],[n,e]]=z.b;if(lat>=s&&lat<=n&&lon>=w&&lon<=e)return z.n;}return null;};

/* =====================================================
   MAP INIT
===================================================== */
function initMap(){
  // Create map with explicit container
  MAP = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    preferCanvas: true
  }).setView([22, 15], 2);

  // Primary: CartoDB dark tiles
  const primary = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {attribution:'© <a href="https://www.openstreetmap.org">OpenStreetMap</a> © <a href="https://carto.com">CARTO</a>',subdomains:'abcd',maxZoom:18}
  );

  // Fallback: Stadia dark tiles
  const fallback = L.tileLayer(
    'https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png',
    {attribution:'© Stadia Maps © OpenStreetMap',maxZoom:20}
  );

  primary.addTo(MAP);

  // If CartoDB tiles fail, switch to fallback
  primary.on('tileerror', function(){
    if(!MAP.hasLayer(fallback)){
      MAP.removeLayer(primary);
      fallback.addTo(MAP);
    }
  });

  // Layer groups
  CL = L.layerGroup().addTo(MAP);
  AL = L.layerGroup().addTo(MAP);
  SL = L.layerGroup().addTo(MAP);
  KL = L.layerGroup().addTo(MAP);

  // Draw chokepoints
  CPS.forEach(cp=>{
    const r=L.rectangle(cp.b,{color:'#f59e0b',weight:1,fillColor:'#f59e0b',fillOpacity:0.07,dashArray:'4,4'});
    r.bindTooltip('⚡ '+cp.n,{direction:'center',sticky:true});
    KL.addLayer(r);
  });

  // Force correct size (fixes 0px height bug)
  setTimeout(()=>MAP.invalidateSize(),100);
  setTimeout(()=>MAP.invalidateSize(),500);

  // Layer toggle listeners
  document.getElementById('la').onchange=e=>{e.target.checked?MAP.addLayer(AL):MAP.removeLayer(AL);};
  document.getElementById('ls').onchange=e=>{e.target.checked?MAP.addLayer(SL):MAP.removeLayer(SL);};
  document.getElementById('lf').onchange=e=>{e.target.checked?MAP.addLayer(CL):MAP.removeLayer(CL);};
  document.getElementById('lk').onchange=e=>{e.target.checked?MAP.addLayer(KL):MAP.removeLayer(KL);};

  console.log('[MAP] Initialized OK');
}

/* =====================================================
   SEVERITY & IMPACT TAGS
===================================================== */
const toSev=t=>t<-10?'CRITICAL':t<-5?'HIGH':t<-2?'MEDIUM':'WATCH';

function detectTags(txt){
  const t=(txt||'').toLowerCase(),r=[];
  if(/oil|gas|fuel|energy|opec|barrel|petroleum|brent|wti/.test(t))r.push('oil');
  if(/gold|silver|metal/.test(t))r.push('gold');
  if(/military|strike|attack|bomb|missile|weapon|army|war|troops|drone|kill|shoot|explosion/.test(t))r.push('defense');
  if(/ship|vessel|port|cargo|container|strait|blockade|tanker|maritime|fleet/.test(t))r.push('shipping');
  if(/wheat|grain|food|crop|famine|agriculture/.test(t))r.push('grain');
  if(/sanction|ruble|forex|bank|swift|currency|freeze|asset/.test(t))r.push('currency');
  return r;
}

function chipsHtml(tags){
  return(tags||[]).map(t=>`<span class="chip c-${t}">${t.toUpperCase()}</span>`).join('');
}

function ppChipsHtml(tags){
  return(tags||[]).map(t=>`<span class="chip c-${t}" style="font-size:9px;padding:1px 6px;">${t.toUpperCase()}</span>`).join('');
}

/* =====================================================
   MARKERS
===================================================== */
function mkConflict(lat,lng,sev,popupHtml){
  const C={CRITICAL:'#ff2424',HIGH:'#f59e0b',MEDIUM:'#eab308',WATCH:'#6b7280'};
  const S={CRITICAL:14,HIGH:11,MEDIUM:9,WATCH:7};
  const c=C[sev]||'#6b7280',s=S[sev]||7;
  const pulse=sev==='CRITICAL';
  const html=`<div style="width:${s}px;height:${s}px;background:${c};border-radius:50%;border:2px solid ${c};box-shadow:0 0 10px ${c};position:relative;">${
    pulse?`<div style="position:absolute;inset:-6px;border-radius:50%;border:2px solid ${c};animation:PULSE 1.8s ease-out infinite;"></div>`:''
  }</div>`;
  const marker=L.marker([lat,lng],{
    icon:L.divIcon({html,className:'',iconSize:[s+4,s+4],iconAnchor:[(s+4)/2,(s+4)/2]})
  });
  marker.bindPopup(popupHtml,{maxWidth:290,className:'warroom-popup'});
  return marker;
}

function mkAircraft(lat,lng,cs,country,alt,vel,hdg,zone){
  const color=zone?'#ff5555':'#00d4ff';
  const html=`<div style="font-size:16px;line-height:1;transform:rotate(${(hdg||0)}deg);filter:drop-shadow(0 0 5px ${color});color:${color};">✈</div>`;
  const marker=L.marker([lat,lng],{icon:L.divIcon({html,className:'',iconSize:[22,22],iconAnchor:[11,11]})});
  marker.bindPopup(
    `<div class="pp-title">✈ ${esc(cs||'UNKNOWN')}</div>`+
    `<div class="pp-row"><span class="pp-label">Country</span><span class="pp-val">${esc(country||'—')}</span></div>`+
    `<div class="pp-row"><span class="pp-label">Altitude</span><span class="pp-val">${alt?Math.round(alt)+'m':'—'}</span></div>`+
    `<div class="pp-row"><span class="pp-label">Speed</span><span class="pp-val">${vel?Math.round(vel)+'m/s':'—'}</span></div>`+
    `<div class="pp-row"><span class="pp-label">Heading</span><span class="pp-val">${hdg?Math.round(hdg)+'°':'—'}</span></div>`+
    (zone?`<div class="pp-warn">⚠ CONFLICT ZONE: ${esc(zone)}</div>`:''),
    {maxWidth:240}
  );
  return marker;
}

function mkShip(lat,lng,name,type,mmsi,spd,cp){
  const tc={tanker:'#fb923c',cargo:'#60a5fa',military:'#ff2424'};
  const t2=(type||'').toLowerCase();
  const ck=t2.includes('tanker')?'tanker':t2.includes('cargo')||t2.includes('container')?'cargo':t2.includes('military')?'military':'';
  const color=tc[ck]||'#9ca3af';
  const html=`<div style="font-size:14px;line-height:1;filter:drop-shadow(0 0 5px ${color});color:${color};">🚢</div>`;
  const marker=L.marker([lat,lng],{icon:L.divIcon({html,className:'',iconSize:[20,18],iconAnchor:[10,9]})});
  marker.bindPopup(
    `<div class="pp-title">🚢 ${esc(name||'UNKNOWN VESSEL')}</div>`+
    `<div class="pp-row"><span class="pp-label">MMSI</span><span class="pp-val">${esc(mmsi||'—')}</span></div>`+
    `<div class="pp-row"><span class="pp-label">Type</span><span class="pp-val">${esc(type||'Unknown')}</span></div>`+
    `<div class="pp-row"><span class="pp-label">Speed</span><span class="pp-val">${spd?parseFloat(spd).toFixed(1)+' kn':'—'}</span></div>`+
    `<div class="pp-row"><span class="pp-label">Position</span><span class="pp-val">${lat.toFixed(2)}°, ${lng.toFixed(2)}°</span></div>`+
    (cp?`<div class="pp-amber">⚡ CHOKEPOINT: ${esc(cp)}</div>`:''),
    {maxWidth:240}
  );
  return marker;
}

/* =====================================================
   ALERTS STORE
===================================================== */
const STORE=[];
let FILTER='all';
const UNREAD={};

const t2f=t=>({oil:'energy',gold:'energy',grain:'energy',shipping:'shipping',defense:'military',currency:'sanctions'}[t]||'all');
const f2t=f=>({energy:'oil',shipping:'shipping',military:'defense',sanctions:'currency'}[f]||'');

function addAlert(a){
  if(STORE.some(x=>x.title===a.title)) return;
  STORE.unshift(a);
  if(STORE.length>70) STORE.pop();
  (a.tags||[]).forEach(t=>{
    const f=t2f(t);
    if(f!=='all'&&f!==FILTER) UNREAD[f]=(UNREAD[f]||0)+1;
  });
  renderFeed();
  document.getElementById('alertct').textContent = STORE.length+' ALERTS';
  renderBadges();
}

function renderFeed(){
  const feed=document.getElementById('feed');
  const ft=f2t(FILTER);
  const vis=STORE.filter(a=>{
    if(FILTER==='all') return true;
    if(FILTER==='diplomacy') return a.cat==='diplomacy';
    return (a.tags||[]).includes(ft);
  });
  if(!vis.length){
    feed.innerHTML='<div style="color:var(--dim);font-size:11px;text-align:center;padding:40px 20px;opacity:0.5;line-height:2;">NO ALERTS<br>FOR THIS FILTER</div>';
    return;
  }
  feed.innerHTML=vis.map(a=>`
    <div class="card ${a.sev.toLowerCase()}" onclick="goAlert('${a.id}')">
      <div class="card-top">
        <span class="sevbadge sev-${a.sev.toLowerCase()}">${a.sev}</span>
        <span class="card-title">${a.flag||''} ${esc(a.title)}</span>
      </div>
      <div class="card-body">${esc(a.summary||'')}</div>
      <div class="card-foot">
        ${chipsHtml(a.tags)}
        <div class="card-meta">
          <span class="csrc">${esc(a.src||'')}</span>
          <span class="ctime">${timeAgo(a.ts)}</span>
        </div>
      </div>
    </div>`).join('');
}

function timeAgo(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60)return'just now';
  if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}

function renderBadges(){
  document.querySelectorAll('.ftab').forEach(tab=>{
    const f=tab.dataset.f,c=UNREAD[f]||0,ex=tab.querySelector('.fbadge');
    if(c>0){if(ex)ex.textContent=c;else tab.insertAdjacentHTML('beforeend',`<span class="fbadge">${c}</span>`);}
    else if(ex) ex.remove();
  });
}

// Bind filter tabs
function bindTabs(){
  document.querySelectorAll('.ftab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('on'));
      tab.classList.add('on');
      FILTER=tab.dataset.f;
      if(UNREAD[FILTER]){UNREAD[FILTER]=0;renderBadges();}
      renderFeed();
    });
  });
}

function goAlert(id){
  const a=STORE.find(x=>x.id===id);
  if(a&&a.lat!=null&&a.lng!=null) MAP.setView([a.lat,a.lng],5,{animate:true});
}

/* =====================================================
   GDELT API  (has open CORS — works directly from browser)
===================================================== */
const seenG=new Set();
function fetchWithTimeout(url, ms, opts={}){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(tid));
}

async function fetchGDELT(){
  setDot('g','y');
  try{
    // GDELT v2 doc endpoint — open CORS, no key needed
    const url='https://api.gdeltproject.org/api/v2/doc/doc'
      +'?query=war%20OR%20attack%20OR%20conflict%20OR%20sanctions%20OR%20missile%20OR%20airstrike%20OR%20explosion'
      +'&mode=artlist&maxrecords=25&format=json&timespan=24h&sourcelang=english';
    const r=await fetchWithTimeout(url,12000);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    let data;
    try{ data=JSON.parse(text); }
    catch{ throw new Error('Bad JSON from GDELT'); }
    const arts=data.articles||[];
    if(!arts.length) throw new Error('no articles returned');
    let n=0;
    arts.forEach(art=>{
      if(!art.url||seenG.has(art.url)) return;
      seenG.add(art.url);
      const tone=parseFloat(art.tone||0);
      const sev=toSev(tone);
      const coords=getCoords(art.sourcecountry);
      const tags=detectTags((art.title||'')+' '+(art.seendescription||''));
      const f=getFlag(art.sourcecountry);
      const ts=parseGDeltDate(art.seendate)||Date.now();
      const id='g_'+n+'_'+ts;
      if(coords){
        const popup=
          `<div class="pp-title">${f} ${esc(art.title)}</div>`+
          `<div class="pp-row"><span class="pp-label">Severity</span><span class="pp-val">${sev}</span></div>`+
          `<div class="pp-row"><span class="pp-label">Tone Score</span><span class="pp-val">${tone.toFixed(1)}</span></div>`+
          `<div class="pp-row"><span class="pp-label">Domain</span><span class="pp-val">${esc(art.domain||'—')}</span></div>`+
          `<div class="pp-chips">${ppChipsHtml(tags)}</div>`+
          `<a class="pp-link" href="${esc(art.url)}" target="_blank" rel="noopener">READ ARTICLE →</a>`;
        CL.addLayer(mkConflict(coords[0],coords[1],sev,popup));
      }
      addAlert({id,title:art.title||'Event',summary:art.seendescription||art.title||'',lat:coords?coords[0]:null,lng:coords?coords[1]:null,sev,tags,flag:f,src:'GDELT',cat:tags.includes('defense')?'military':tags.includes('currency')?'sanctions':'military',ts});
      n++;
    });
    setDot('g','g'); setLive();
    console.log('[GDELT] +'+n+' live articles loaded');
  }catch(e){
    console.warn('[GDELT] '+e.message);
    setDot('g','r');
  }
}
function parseGDeltDate(s){
  if(!s) return null;
  try{const str=String(s);return new Date(`${str.slice(0,4)}-${str.slice(4,6)}-${str.slice(6,8)}T${str.slice(8,10)}:${str.slice(10,12)}:${str.slice(12,14)}Z`).getTime();}
  catch{return null;}
}

/* =====================================================
   OPENSKY API  (routed through corsproxy.io to bypass CORS)
===================================================== */
async function fetchOpenSky(){
  setDot('s','y');
  try{
    const target='https://opensky-network.org/api/states/all?'
      // Fetch only conflict zone bounding boxes to reduce response size
      +'lamin=1&lomin=20&lamax=60&lomax=145'; // broad box covering ME, EU, Asia
    // corsproxy.io injects CORS headers server-side
    const proxyUrl='https://corsproxy.io/?url='+encodeURIComponent(
      'https://opensky-network.org/api/states/all'
    );
    const r=await fetchWithTimeout(proxyUrl,12000,{
      headers:{Authorization:'Basic '+btoa(OPENSKY_USER+':'+OPENSKY_PASS)}
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(!data.states) throw new Error('no states in response');
    const rel=data.states.filter(s=>
      s[5]!=null&&s[6]!=null&&!s[8]&&inCZ(s[6],s[5])
    ).slice(0,100);
    AL.clearLayers();
    rel.forEach(s=>{
      const[,cs,country,,,lon,lat,,og,vel,hdg]=s;
      if(og) return;
      AL.addLayer(mkAircraft(lat,lon,(cs||'').trim(),country,s[7],vel,hdg,inCZ(lat,lon)));
    });
    setDot('s','g'); setLive();
    console.log('[OpenSky] '+rel.length+' aircraft in conflict zones');
  }catch(e){
    console.warn('[OpenSky] '+e.message);
    setDot('s','r');
    // sim aircraft already added on init, keep them
  }
}

      const tags=detectTags(text);
      const sev=tags.includes('defense')?'HIGH':tags.length>1?'MEDIUM':'WATCH';
      addAlert({
        id:'n_'+n+'_'+Date.now(),
        title:art.title||'News',
        summary:art.description||art.title||'',
        lat:null,lng:null,sev,tags,
        flag:'📰',
        src:art.source?.name||'NewsAPI',
        cat:tags.includes('currency')?'sanctions':'military',
        ts:new Date(art.publishedAt).getTime()||Date.now()
      });
      n++;
    });
    setDot('n','g'); setLive();
    console.log('[NewsAPI] +'+n+' articles via proxy');
  }catch(e){
    console.warn('[NewsAPI] '+e.message);
    setDot('n','r');
  }
}

/* =====================================================
   AISSTREAM
===================================================== */
let AIS=null, AISP=null;
function connectAIS(){
  if(AIS&&(AIS.readyState===0||AIS.readyState===1)) return;
  setDot('a','y');
  try{
    AIS=new WebSocket('wss://stream.aisstream.io/v0/stream');
    AIS.onopen=()=>{
      AIS.send(JSON.stringify({
        APIKey:AISSTREAM_KEY,
        BoundingBoxes:[[[-90,-180],[90,180]]],
        FilterMessageTypes:['PositionReport']
      }));
      setDot('a','g'); setLive();
      console.log('[AIS] WebSocket connected');
      clearInterval(AISP);
      AISP=setInterval(()=>{if(AIS.readyState===1)AIS.send(JSON.stringify({type:'ping'}));},25000);
    };
    AIS.onmessage=evt=>{
      try{
        const msg=JSON.parse(evt.data);
        if(!msg.Message?.PositionReport) return;
        const pr=msg.Message.PositionReport, meta=msg.MetaData||{};
        const lat=parseFloat(pr.Latitude), lon=parseFloat(pr.Longitude);
        if(isNaN(lat)||isNaN(lon)||Math.abs(lat)<0.01&&Math.abs(lon)<0.01) return;
        const mmsi=String(meta.MMSI||pr.UserID||Math.random());
        const name=(meta.ShipName||'MMSI-'+mmsi).trim();
        const type=String(meta.ShipType||'unknown');
        const cp=inCP(lat,lon);
        // Cap at 300 live ships to avoid map overload
        const liveShipCount=Object.keys(SM).filter(k=>!k.startsWith('ss')).length;
        if(SM[mmsi]){
          SM[mmsi].marker.setLatLng([lat,lon]);
        } else if(liveShipCount<300){
          const m=mkShip(lat,lon,name,type,mmsi,pr.Sog,cp);
          SL.addLayer(m);
          SM[mmsi]={marker:m};
        }
        if(cp&&SM[mmsi]&&!SM[mmsi].alerted){
          SM[mmsi].alerted=true;
          addAlert({id:'ais_'+mmsi+'_'+Date.now(),title:`${name} entering ${cp}`,summary:`${type} vessel entering chokepoint. Speed: ${pr.Sog?parseFloat(pr.Sog).toFixed(1)+' kn':'unknown'}.`,lat,lng:lon,sev:'MEDIUM',tags:['shipping'],flag:'⚡',src:'AISStream',cat:'shipping',ts:Date.now()});
        }
      }catch(e){}
    };
    AIS.onerror=()=>{ setDot('a','r'); };
    AIS.onclose=()=>{ setDot('a','r'); clearInterval(AISP); setTimeout(connectAIS,20000); };
  }catch(e){
    console.warn('[AIS] '+e.message);
    setDot('a','r');
  }
}

/* =====================================================
   STATUS HELPERS
===================================================== */
function setDot(name,c){
  const el=document.getElementById('dot-'+name);
  if(el) el.className='dot '+c;
}
let liveCount=0;
function setLive(){
  if(++liveCount===1){
    const b=document.getElementById('livetag');
    b.className='bliv';
    b.textContent='● LIVE';
  }
}

/* =====================================================
   CLOCK
===================================================== */
function updateClock(){
  const n=new Date();
  document.getElementById('clk').textContent=
    String(n.getUTCHours()).padStart(2,'0')+':'+
    String(n.getUTCMinutes()).padStart(2,'0')+':'+
    String(n.getUTCSeconds()).padStart(2,'0')+' UTC';
}

/* =====================================================
   LOADING ANIMATION
===================================================== */
async function runBoot(){
  const bar=document.getElementById('ov-bar');
  const msg=document.getElementById('ov-msg');
  const steps=[
    [20,'LOADING MAP ENGINE...'],
    [40,'INITIALIZING LEAFLET...'],
    [60,'LOADING THREAT DATABASE...'],
    [80,'CONNECTING LIVE FEEDS...'],
    [100,'▣ WARROOM ONLINE — ALL SYSTEMS GO']
  ];
  for(const[p,m] of steps){
    if(bar) bar.style.width=p+'%';
    if(msg) msg.textContent=m;
    await sleep(350);
  }
  await sleep(500);
  hideOverlay();
}

function hideOverlay(){
  const ov=document.getElementById('ov');
  if(!ov) return;
  ov.style.transition='opacity 0.7s ease';
  ov.style.opacity='0';
  ov.style.pointerEvents='none';
  setTimeout(()=>{ ov.style.display='none'; }, 750);
}

/* =====================================================
   MAIN — window.onload guarantees everything is ready
===================================================== */
window.onload = function(){
  // Absolute failsafe: hide loading after 6s no matter what
  setTimeout(hideOverlay, 6000);

  // Clock
  setInterval(updateClock,1000);
  updateClock();

  // Ticker
  buildTicker();
  setInterval(tickUpdate,4000);

  // Filter tabs
  bindTabs();

  // Boot animation (non-blocking, errors handled)
  runBoot().catch(hideOverlay);

  // ── INIT MAP (synchronous, L is guaranteed ready) ──
  try{
    initMap();
  }catch(e){
    console.error('[MAP INIT FAILED]', e);
    return; // Map is essential; abort if broken
  }

  // ── LOAD SEED DATA (slight delay so map renders first) ──
  setTimeout(()=>{
    try{ loadSeed(); }
    catch(e){ console.error('[SEED FAILED]',e); }
  }, 300);

  // ── SIM DATA ──
  setTimeout(()=>{
    try{ simAircraft(); simShips(); }
    catch(e){ console.error('[SIM FAILED]',e); }
  }, 400);

  // ── LIVE APIs (staggered to avoid rate limits) ──
  setTimeout(()=>fetchGDELT().catch(()=>{}),   1500);
  setTimeout(()=>fetchOpenSky().catch(()=>{}), 2200);
  setTimeout(()=>fetchNewsAPI().catch(()=>{}), 3000);
  setTimeout(()=>connectAIS(),                 3500);

  // ── POLLING INTERVALS ──
  setInterval(()=>fetchGDELT().catch(()=>{}),   5*60*1000);
  setInterval(()=>fetchOpenSky().catch(()=>{}), 30*1000);
  setInterval(()=>fetchNewsAPI().catch(()=>{}), 3*60*1000);
  setInterval(renderFeed, 60*1000); // refresh "X min ago" labels
};
</script>
